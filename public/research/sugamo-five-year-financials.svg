<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">FIVE-YEAR FINANCIAL TRACK / 2021-2025</title>
  <desc id="desc">五年財務軌跡</desc>
  <rect width="1100" height="640" fill="#071225"/>
