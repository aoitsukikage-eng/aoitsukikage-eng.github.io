<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio optimization comparison framework</title>
  <desc id="desc">An original workflow diagram showing historical returns, expected returns and covariance, three portfolio constructions, and a comparison by risk, expected return and Sharpe ratio.</desc>
  <rect width="1200" height="675" fill="#081226"/>
  <text x="80" y="95" fill="#e9f6ff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Portfolio optimization &amp; Sharpe ratio</text>
  <text x="80" y="135" fill="#91b8d8" font-family="Arial, sans-serif" font-size="20">Original framework diagram — no source values are reproduced</text>
  <g fill="none" stroke="#5be7ff" stroke-width="3">
    <path d="M280 270H385M610 270H710M875 345V445"/>
    <path d="M875 270V445" stroke="#577695" stroke-dasharray="9 10"/>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="205" width="200" height="130" rx="18" fill="#102747" stroke="#5be7ff"/>
    <text x="180" y="258" fill="#e9f6ff" font-size="24" text-anchor="middle">Historical returns</text>
    <text x="180" y="291" fill="#91b8d8" font-size="18" text-anchor="middle">fund data series</text>
    <rect x="385" y="205" width="225" height="130" rx="18" fill="#102747" stroke="#5be7ff"/>
    <text x="497" y="254" fill="#e9f6ff" font-size="23" text-anchor="middle">Inputs</text>
    <text x="497" y="288" fill="#91b8d8" font-size="18" text-anchor="middle">expected return · covariance</text>
    <rect x="710" y="175" width="330" height="190" rx="18" fill="#102747" stroke="#5be7ff"/>
    <text x="875" y="225" fill="#e9f6ff" font-size="24" text-anchor="middle">Portfolio constructions</text>
    <text x="875" y="266" fill="#91b8d8" font-size="18" text-anchor="middle">equal weight</text>
    <text x="875" y="297" fill="#91b8d8" font-size="18" text-anchor="middle">global minimum variance</text>
    <text x="875" y="328" fill="#91b8d8" font-size="18" text-anchor="middle">maximum Sharpe ratio</text>
    <rect x="355" y="445" width="520" height="135" rx="18" fill="#153356" stroke="#92f0c6"/>
    <text x="615" y="495" fill="#e9f6ff" font-size="25" text-anchor="middle">Compare the efficient frontier</text>
    <text x="615" y="532" fill="#b6d9ef" font-size="19" text-anchor="middle">risk · expected return · Sharpe ratio</text>
  </g>
</svg>
