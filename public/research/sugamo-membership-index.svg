<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" role="img" aria-labelledby="title desc">
  <title id="title">STRUCTURAL DECLINE INDEX</title>
  <desc id="desc">社員・職員・出資口數的結構性下滑</desc>
  <rect width="950" height="560" fill="#071225"/>
  <text x="80" y="40" fill="#5be7ff" font-family="Orbitron, sans-serif" font-size="22" letter-spacing="2">MEMBERSHIP &amp; STAFFING INDEX / 2021-2025</text>
  <text x="80" y="65" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14">指數化到 2021/3 = 100；僅有兩期端點資料，中間年度未揭露</text>

  <!-- Legend -->
  <rect x="80" y="90" width="16" height="16" fill="#2b9ec0"/>
  <text x="104" y="104" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="16">社員數</text>
  <rect x="180" y="90" width="16" height="16" fill="#bb8c30"/>
  <text x="204" y="104" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="16">職員數</text>
  <rect x="280" y="90" width="16" height="16" fill="#d75f93"/>
  <text x="304" y="104" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="16">出資口數</text>

  <!-- Grids -->
  <g stroke="#5be7ff" stroke-opacity=".16" stroke-width="1">
    <path d="M150 450H750M150 350H750M150 250H750M150 150H750"/>
  </g>
  <!-- Axis -->
  <g fill="none" stroke="#9eb5d7" stroke-width="2">
    <path d="M150 150V450"/>
    <path d="M750 150V450"/>
  </g>
  <!-- Y-axis -->
  <g fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="end">
    <text x="140" y="455">86</text>
    <text x="140" y="355">90</text>
    <text x="140" y="255">94</text>
    <text x="140" y="155">98</text>
    <text x="140" y="105">102</text>
  </g>

  <!-- Lines -->
  <!-- 102 -> y=50, 100 -> y=100, 86 -> y=450 -->
  <!-- 社員 C1 -->
  <path d="M150 100 L750 292.5" fill="none" stroke="#2b9ec0" stroke-width="3"/>
  <circle cx="150" cy="100" r="5" fill="#2b9ec0"/>
  <circle cx="750" cy="292.5" r="5" fill="#2b9ec0"/>
  <text x="140" y="95" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="end">社員 70,061</text>
  <text x="760" y="297" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="start">64,644 (-7.7%) [92.3]</text>

  <!-- 職員 C2 -->
  <path d="M150 100 L750 302.5" fill="none" stroke="#bb8c30" stroke-width="3"/>
  <circle cx="150" cy="100" r="5" fill="#bb8c30"/>
  <circle cx="750" cy="302.5" r="5" fill="#bb8c30"/>
  <text x="140" y="115" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="end">職員 1,038</text>
  <text x="760" y="317" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="start">954 (-8.1%) [91.9]</text>

  <!-- 出資 C3 -->
  <path d="M150 100 L750 235" fill="none" stroke="#d75f93" stroke-width="3"/>
  <circle cx="150" cy="100" r="5" fill="#d75f93"/>
  <circle cx="750" cy="235" r="5" fill="#d75f93"/>
  <text x="140" y="75" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="end">出資口數 5,543千口</text>
  <text x="760" y="240" fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="start">5,245千口 (-5.4%) [94.6]</text>

  <g fill="#b7c8e4" font-family="IBM Plex Sans, sans-serif" font-size="16" text-anchor="middle">
    <text x="150" y="480">2021/3</text>
    <text x="750" y="480">2025/3</text>
  </g>

  <text x="930" y="540" fill="#5be7ff" font-family="IBM Plex Sans, sans-serif" font-size="14" text-anchor="end">© 2026 Yuhung Shih · aoitsukikage-eng.github.io</text>
</svg>